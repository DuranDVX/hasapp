<!doctype html>
<html lang="en" data-app="sitebakkie">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SiteBakkie admin</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/family-admin.css">
<script src="/family-admin.js"></script>
</head>
<body>
<header class="fa-head"><img class="logo" src="/logo-head.png" alt="SiteBakkie"><span class="fa-tag">Admin</span>
  <nav class="fa-switch hidden" id="sw">
    <a class="on" href="/admin.html"><span class="dot" style="background:var(--sb)"></span>SiteBakkie</a>
    <button type="button" id="to-qb"><span class="dot" style="background:var(--qb)"></span>QuoteBakkie</button></nav>
  <span class="fa-grow"></span><span class="fa-who" id="who"></span>
  <button class="small hidden" id="out">Log out</button></header>
<main id="view"></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let code = null, tok = null;
try { code = localStorage.getItem("sb-admin"); tok = localStorage.getItem("bakkie-admin"); } catch {}
const store = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} };
async function api(path, opts = {}) {
  const h = { "Content-Type": "application/json" }; if (tok) h["X-Admin-Session"] = tok; if (code) h["X-Admin"] = code;
  const r = await fetch(path, { method: opts.method || (opts.json ? "POST" : "GET"), headers: h,
    body: opts.json ? JSON.stringify(opts.json) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.detail || "Failed"); e.status = r.status; throw e; }
  return d;
}
const fmt = (t) => t ? t.replace("T", " ") : "never";
const wantApp = new URLSearchParams(location.search).get("to");   // QuoteBakkie sends you here to log in
function chrome(on) {
  $("#out").classList.toggle("hidden", !on); $("#sw").classList.toggle("hidden", !on);
  if (!on) $("#who").textContent = "";
}
async function goQB() {
  if (!tok) { location.href = "https://www.quotebakkie.co.za/admin.html"; return; }
  try { const r = await api("/api/family/handoff", { json: { app: "quotebakkie" } }); location.href = r.url; }
  catch (e) { alert(e.message); }
}
$("#to-qb").onclick = goQB;
async function signedIn(d) {
  tok = d.token; code = null; store("bakkie-admin", tok); store("sb-admin", null);
  history.replaceState(null, "", "/admin.html");   // a page change tells the browser the login worked, so it offers to save
  if (wantApp === "quotebakkie") return goQB();
  load();
}
function login(msg = "") {
  chrome(false);
  $("#view").innerHTML = `<form class="card fa-login" id="al" method="post" action="#">
      <div class="logos"><img src="/logo-head.png" alt="SiteBakkie"><img src="/qb-logo.png" alt="QuoteBakkie"></div>
      <h1>Bakkie admin</h1><p class="lead">One login for SiteBakkie and QuoteBakkie.</p>
      <label for="al-email">Email</label><input id="al-email" name="username" type="email" autocomplete="username" autocapitalize="off" required>
      <label for="al-pw">Password</label><input id="al-pw" name="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Log in</button><p class="crit small center">${esc(msg)}</p>
      <details class="small"><summary>Use the SiteBakkie admin code instead</summary><input id="code" type="password" autocomplete="off" placeholder="Admin code">
        <button class="small" type="button" id="go">Open</button></details></form>`;
  $("#al").onsubmit = async (e) => {
    e.preventDefault();
    try { await signedIn(await api("/api/family/login", { json: { email: $("#al-email").value.trim(), password: $("#al-pw").value } })); }
    catch (err) { login(err.message); }
  };
  $("#go").onclick = () => { code = $("#code").value.trim(); tok = null; store("sb-admin", code); store("bakkie-admin", null); load(); };
}
function setPassword(token, msg = "") {
  chrome(false);
  $("#view").innerHTML = `<form class="card fa-login" id="sp" method="post" action="#">
      <div class="logos"><img src="/logo-head.png" alt="SiteBakkie"><img src="/qb-logo.png" alt="QuoteBakkie"></div>
      <h1>Choose your password</h1><p class="lead">For the Bakkie admin login. Your browser can save it.</p>
      <label for="sp-email">Email</label><input id="sp-email" name="username" type="email" autocomplete="username" autocapitalize="off" placeholder="info@sitebakkie.co.za" required>
      <label for="sp-pw">New password (8 or more characters)</label><input id="sp-pw" name="new-password" type="password" autocomplete="new-password" required>
      <label for="sp-pw2">Type it again</label><input id="sp-pw2" type="password" autocomplete="new-password" required>
      <button class="primary" type="submit">Save and log in</button><p class="crit small center">${esc(msg)}</p></form>`;
  api("/api/family/setpw-email?token=" + encodeURIComponent(token)).then((r) => { $("#sp-email").value = r.email; })
    .catch((err) => { if (!msg) setPassword(token, err.message); });
  $("#sp").onsubmit = async (e) => {
    e.preventDefault();
    if ($("#sp-pw").value !== $("#sp-pw2").value) return setPassword(token, "The two passwords are not the same.");
    try { await signedIn(await api("/api/family/password", { json: { token, password: $("#sp-pw").value } })); }
    catch (err) { setPassword(token, err.message); }
  };
}
$("#out").onclick = () => {
  if (tok) api("/api/family/logout", { json: {} }).catch(() => {});
  store("sb-admin", null); store("bakkie-admin", null); code = tok = null; login();
};
let D = null;
let STATS_DAYS = 30;
async function loadVisitors(el) {
  try { FA.visitors(el, await api("/api/admin/stats?days=" + STATS_DAYS), { site: "www.sitebakkie.co.za", onDays: (d) => { STATS_DAYS = d; loadVisitors(el); } }); }
  catch (e) { el.innerHTML = `<p class="crit small">${esc(e.message)}</p>`; }
}
async function load() {
  try { D = await api("/api/admin/overview"); } catch (e) {
    if (e.status === 401) { tok = code = null; store("sb-admin", null); store("bakkie-admin", null); }
    return login(e.status === 401 ? "Log in again." : e.message);
  }
  chrome(true);
  if (tok) api("/api/family/me").then((m) => { $("#who").textContent = m.email; }).catch(() => {});
  const cs = D.companies, P = FA.frame($("#view"), { title: "SiteBakkie", addLabel: "Add customer",
    sub: "Every builder on SiteBakkie: logins, sign-ups and payments. Temporary passwords show once; give them to the person." });
  // 1. add a customer
  P.add.innerHTML = `<b>Add a customer</b> <span class="muted small">They get a login and a temporary password to send them.</span>
    <div class="grid2" style="margin-top:8px"><input id="nc-name" placeholder="Company name (e.g. JB Civils)"><input id="nc-owner" placeholder="Owner's name"></div>
    <input id="nc-email" type="email" placeholder="Owner's email" autocapitalize="off" autocorrect="off">
    <button class="primary" id="nc-add">Make the account</button>`;
  // 2. six numbers (billing is not live yet: every company is on the pilot)
  const active = cs.filter((c) => c.active);
  FA.tiles(P.tiles, [
    { label: "Customers", value: cs.length, hint: `${D.totals.sites} sites` },
    { label: "Paying", value: 0, hint: "Billing not live yet" },
    { label: "Trial / free", value: active.length, hint: "Pilot" },
    { label: "New, 30 days", value: cs.filter((c) => FA.daysAgo(c.created_at) <= 30).length },
    { label: "Active, 30 days", value: cs.filter((c) => c.records_30d > 0).length, hint: `${D.totals.records_7d} records this week`, tone: "ok" },
    { label: "Visitors, 7 days", value: "…", hint: "Website" }]);
  api("/api/admin/stats?days=7").then((s) => { P.tiles.lastElementChild.querySelector("b").textContent = s.week; }).catch(() => {});
  // 3. needs you
  const resets = D.resets.filter((r) => !r.used && !r.emailed);
  FA.needs(P.needs, resets.map((r) => ({ tone: "warn",
    html: `<span><b>${esc(r.name)}</b> (${esc(r.email)}) asked for a new password ${esc(fmt(r.at))}.</span>
      <button class="small" data-reset="${r.user_id}">New password</button><div data-out="${r.user_id}"></div>` })));
  // 4. customers
  const role = (u) => `<select data-role="${u.id}" style="margin:0;padding:6px;width:auto">${Object.entries(D.roles).map(([k, v]) => `<option value="${k}" ${k === u.role ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>`;
  FA.customers(P.customers, cs, {
    filters: [{ key: "all", label: "All", test: () => true }, { key: "paying", label: "Paying", test: () => false },
      { key: "trial", label: "Trial / free", test: (c) => c.active }, { key: "off", label: "Off", test: (c) => !c.active }],
    text: (c) => [c.name, c.email, ...c.users.map((u) => u.name + " " + u.email)].join(" "),
    empty: "No companies yet.",
    toCard: (c) => ({ id: c.id, name: c.name, off: !c.active,
      badge: c.active ? { text: "Pilot", tone: "ok" } : { text: "Switched off", tone: "bad" },
      meta: [c.users[0] && c.users[0].name, c.email, `signed up ${fmt(c.created_at).slice(0, 10)}`, c.invite && `invite ${c.invite}`],
      usage: `${c.sites} site(s) · ${c.workers} worker(s) · ${c.records} record(s), ${c.records_7d} this week · last activity ${fmt(c.last_activity)}`,
      actions: `<button class="small" data-co="${c.id}" data-on="${c.active ? 0 : 1}">${c.active ? "Switch company off" : "Switch company on"}</button>`,
      extra: `<details><summary class="small">Logins (${c.users.length})</summary>
        <table class="users" style="margin-top:6px"><tr><th>Name</th><th>Email</th><th>Role</th><th>Last login</th><th></th></tr>
        ${c.users.map((u) => `<tr class="${u.active ? "" : "off"}"><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${role(u)}</td><td>${fmt(u.last_login_at)}</td>
          <td><div class="actions-row"><button class="small" data-reset="${u.id}">New password</button>
            <button class="small" data-user="${u.id}" data-on="${u.active ? 0 : 1}">${u.active ? "Switch off" : "Switch on"}</button></div>
            <div data-out="${u.id}"></div></td></tr>`).join("")}</table>
        <div class="grid2" style="margin-top:8px"><input data-new-name="${c.id}" placeholder="Name"><input data-new-email="${c.id}" placeholder="Email"></div>
        <select data-new-role="${c.id}">${Object.entries(D.roles).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("")}</select>
        <button class="small primary" data-add="${c.id}">Add login</button></details>` }) });
  // 5. sign-ups: invite codes
  P.signups.innerHTML = `<p class="small muted" style="margin-top:0">Sign-up needs an invite code. Sign-up page: ${esc(location.origin)}/app.html#signup</p>
    <table class="users"><tr><th>Code</th><th>For</th><th>Sign-ups</th><th>Status</th><th></th></tr>
      ${D.invites.map((i) => `<tr class="${i.active ? "" : "off"}"><td><b>${esc(i.code)}</b></td><td>${esc(i.label)}</td><td>${i.uses}</td>
        <td>${FA.badge(i.active ? "Active" : "Off", i.active ? "ok" : "")}</td>
        <td><button class="small" data-inv="${esc(i.code)}" data-on="${i.active ? 0 : 1}">${i.active ? "Switch off" : "Switch on"}</button></td></tr>`).join("")}
      ${D.env_invites.map((c) => `<tr><td><b>${esc(c)}</b></td><td class="muted">set in Railway (HAS_SIGNUP_CODE)</td><td></td><td>${FA.badge("Active", "ok")}</td><td></td></tr>`).join("")}</table>
    <div class="row" style="margin-top:10px"><input id="inv-label" placeholder="Who is it for? (e.g. Pieter, Plett Builders)" style="margin:0"><button class="small primary" id="inv-add">New code</button></div>
    <div id="inv-out"></div>`;
  // 6. website visitors
  loadVisitors(P.visitors);
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  try {
    if (b.dataset.reset) {
      if (!confirm("Make a new temporary password? The person's other devices are logged out.")) return;
      const r = await api(`/api/admin/users/${b.dataset.reset}`, { method: "PUT", json: { reset_password: true } });
      document.querySelectorAll(`[data-out="${b.dataset.reset}"]`).forEach((el) => el.innerHTML = `<div class="small" style="margin-top:4px">New password: <span class="pw">${esc(r.temp_password)}</span></div>`);
    } else if (b.dataset.user) {
      await api(`/api/admin/users/${b.dataset.user}`, { method: "PUT", json: { active: b.dataset.on === "1" } }); load();
    } else if (b.dataset.co) {
      if (b.dataset.on === "0" && !confirm("Switch off this company? All its logins stop working until you switch it on again.")) return;
      await api(`/api/admin/companies/${b.dataset.co}`, { method: "PUT", json: { active: b.dataset.on === "1" } }); load();
    } else if (b.dataset.inv) {
      await api(`/api/admin/invites/${encodeURIComponent(b.dataset.inv)}`, { method: "PUT", json: { active: b.dataset.on === "1" } }); load();
    } else if (b.id === "nc-add") {
      const r = await api("/api/admin/companies", { json: { name: $("#nc-name").value, owner: $("#nc-owner").value, email: $("#nc-email").value.trim() } });
      await load();
      const msg = `Your SiteBakkie login is ready.\nOpen ${location.origin}/app.html\nEmail: ${r.email}\nTemporary password: ${r.temp_password}\nChange it under More → My profile.`;
      $("#fa-add").classList.remove("hidden");
      $("#fa-add").insertAdjacentHTML("beforeend", `<div class="note ok"><b>Account made.</b> Send this to the owner:<pre style="white-space:pre-wrap;margin:8px 0 0">${esc(msg)}</pre></div>`);
      scrollTo(0, 0);
    } else if (b.id === "inv-add") {
      const r = await api("/api/admin/invites", { json: { label: $("#inv-label").value } });
      await load(); $("#inv-out").innerHTML = `<div class="note ok">New code: <b>${esc(r.code)}</b>. Sign-up page: ${location.origin}/app.html#signup</div>`;
    } else if (b.dataset.add) {
      const id = b.dataset.add;
      const r = await api("/api/admin/users", { json: { company_id: id, name: document.querySelector(`[data-new-name="${id}"]`).value,
        email: document.querySelector(`[data-new-email="${id}"]`).value, role: document.querySelector(`[data-new-role="${id}"]`).value } });
      await load(); alert(`Login made for ${r.email}. Temporary password: ${r.temp_password}`);
    }
  } catch (err) { alert(err.message); }
});
document.addEventListener("change", async (e) => {
  const id = e.target.dataset.role; if (!id) return;
  try { await api(`/api/admin/users/${id}`, { method: "PUT", json: { role: e.target.value } }); } catch (err) { alert(err.message); load(); }
});
const setpw = location.hash.match(/^#setpw\/(.+)$/);
if (setpw) setPassword(setpw[1]);
else if (tok && wantApp === "quotebakkie") goQB();
else if (code || tok) load();
else login();
</script>
</body>
</html>
