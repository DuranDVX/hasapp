<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SiteBakkie admin</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/style.css">
<style>
  main { max-width: 1100px; padding-bottom: 40px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .stats .card { text-align: center; } .stats b { display: block; font-size: 26px; }
  table.users { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.users td, table.users th { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.users th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .actions-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .off { opacity: .55; }
  .pw { font-family: ui-monospace, monospace; background: var(--amber-bg); color: var(--amber); padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<header><img class="brand-logo" src="/logo-head.png" alt="SiteBakkie" style="display:block"><span class="grow"></span><b>Admin</b>
  <button class="small hidden" id="out" style="margin-left:8px">Log out</button></header>
<main id="view"></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let code = null; try { code = localStorage.getItem("sb-admin"); } catch {}
async function api(path, opts = {}) {
  const r = await fetch(path, { method: opts.method || (opts.json ? "POST" : "GET"), headers: { "X-Admin": code, "Content-Type": "application/json" },
    body: opts.json ? JSON.stringify(opts.json) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.detail || "Failed"); e.status = r.status; throw e; }
  return d;
}
const fmt = (t) => t ? t.replace("T", " ") : "never";
function login(msg = "") {
  $("#out").classList.add("hidden");
  $("#view").innerHTML = `<div class="page-head"><h1>Admin</h1><p>All companies and logins on SiteBakkie.</p></div>
    <div class="card" style="max-width:420px"><label>Admin code</label><input id="code" type="password" autocomplete="current-password">
    <button class="primary" id="go">Open</button><p class="crit small">${esc(msg)}</p></div>`;
  $("#go").onclick = () => { code = $("#code").value.trim(); try { localStorage.setItem("sb-admin", code); } catch {} load(); };
  $("#code").onkeydown = (e) => { if (e.key === "Enter") $("#go").click(); };
}
$("#out").onclick = () => { try { localStorage.removeItem("sb-admin"); } catch {} code = null; login(); };
let D = null;
async function load() {
  try { D = await api("/api/admin/overview"); } catch (e) { return login(e.status === 401 ? "Wrong admin code." : e.message); }
  $("#out").classList.remove("hidden");
  const t = D.totals;
  $("#view").innerHTML = `<div class="page-head"><h1>Admin</h1><p>Every company and login on SiteBakkie. Temporary passwords show once; give them to the person.</p></div>
    <div class="stats">${[["Companies", t.companies], ["Logins", t.users], ["Sites", t.sites], ["Workers", t.workers], ["Records", t.records], ["Records, 7 days", t.records_7d]]
      .map(([l, v]) => `<div class="card"><b>${v}</b><span class="muted small">${l}</span></div>`).join("")}</div>
    ${D.resets.filter((r) => !r.used && !r.emailed).length ? `<h2>Password help</h2><div class="card"><p class="small muted">These people asked for a new password and email is not set up. Make a new password and send it to them.</p>
      <table class="users">${D.resets.filter((r) => !r.used && !r.emailed).map((r) => `<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${fmt(r.at)}</td>
        <td><button class="small" data-reset="${r.user_id}">New password</button><div data-out="${r.user_id}"></div></td></tr>`).join("")}</table></div>` : ""}
    <h2>Invite codes</h2>
    <div class="card"><table class="users"><tr><th>Code</th><th>For</th><th>Sign-ups</th><th>Status</th><th></th></tr>
      ${D.invites.map((i) => `<tr class="${i.active ? "" : "off"}"><td><b>${esc(i.code)}</b></td><td>${esc(i.label)}</td><td>${i.uses}</td>
        <td><span class="badge ${i.active ? "ok" : ""}">${i.active ? "Active" : "Off"}</span></td>
        <td><button class="small" data-inv="${esc(i.code)}" data-on="${i.active ? 0 : 1}">${i.active ? "Switch off" : "Switch on"}</button></td></tr>`).join("")}
      ${D.env_invites.map((c) => `<tr><td><b>${esc(c)}</b></td><td class="muted">set in Railway (HAS_SIGNUP_CODE)</td><td></td><td><span class="badge ok">Active</span></td><td></td></tr>`).join("")}</table>
      <div class="row" style="margin-top:10px"><input id="inv-label" placeholder="Who is it for? (e.g. Pieter, Plett Builders)" style="margin:0"><button class="small primary" id="inv-add">New code</button></div>
      <div id="inv-out"></div></div>
    <h2>Companies (${D.companies.length})</h2>
    <details class="card"><summary><b>+ New company</b> <span class="muted small">(make the account for them; they get a temporary password)</span></summary>
      <div class="grid2" style="margin-top:8px"><input id="nc-name" placeholder="Company name (e.g. JB Civils)"><input id="nc-owner" placeholder="Owner's name"></div>
      <input id="nc-email" type="email" placeholder="Owner's email" autocapitalize="off" autocorrect="off">
      <button class="small primary" id="nc-add">Make company</button><div id="nc-out"></div></details>
    ${D.companies.map((c) => `<div class="card ${c.active ? "" : "off"}">
      <div class="row between wrap"><div><b style="font-size:18px">${esc(c.name)}</b> ${c.active ? "" : '<span class="badge bad">Switched off</span>'}
        <div class="muted small">Signed up ${fmt(c.created_at)} · invite ${esc(c.invite || "-")} · ${c.sites} site(s) · ${c.workers} worker(s) · ${c.records} record(s), ${c.records_7d} this week · last activity ${fmt(c.last_activity)}</div></div>
        <button class="small" data-co="${c.id}" data-on="${c.active ? 0 : 1}">${c.active ? "Switch company off" : "Switch company on"}</button></div>
      <table class="users" style="margin-top:8px"><tr><th>Name</th><th>Email</th><th>Role</th><th>Last login</th><th></th></tr>
        ${c.users.map((u) => `<tr class="${u.active ? "" : "off"}"><td>${esc(u.name)}</td><td>${esc(u.email)}</td>
          <td><select data-role="${u.id}" style="margin:0;padding:6px">${Object.entries(D.roles).map(([k, v]) => `<option value="${k}" ${k === u.role ? "selected" : ""}>${esc(v)}</option>`).join("")}</select></td>
          <td>${fmt(u.last_login_at)}</td>
          <td><div class="actions-row"><button class="small" data-reset="${u.id}">New password</button>
            <button class="small" data-user="${u.id}" data-on="${u.active ? 0 : 1}">${u.active ? "Switch off" : "Switch on"}</button></div>
            <div data-out="${u.id}"></div></td></tr>`).join("")}</table>
      <details style="margin-top:6px"><summary class="small">+ Add a login to this company</summary>
        <div class="grid2"><input data-new-name="${c.id}" placeholder="Name"><input data-new-email="${c.id}" placeholder="Email"></div>
        <select data-new-role="${c.id}">${Object.entries(D.roles).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("")}</select>
        <button class="small primary" data-add="${c.id}">Add login</button><div data-add-out="${c.id}"></div></details></div>`).join("") || `<p class="muted">No companies yet.</p>`}`;
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  try {
    if (b.dataset.reset) {
      if (!confirm("Make a new temporary password? The person's other devices are logged out.")) return;
      const r = await api(`/api/admin/users/${b.dataset.reset}`, { method: "PUT", json: { reset_password: true } });
      document.querySelectorAll(`[data-out="${b.dataset.reset}"]`).forEach((el) => el.innerHTML = `<div class="small" style="margin-top:4px">New password: <span class="pw">${esc(r.temp_password)}</span></div>`);
    } else if (b.dataset.user) {
      await api(`/api/admin/users/${b.dataset.user}`, { method: "PUT", json: { active: b.dataset.on === "1" } }); load();
    } else if (b.dataset.co) {
      if (b.dataset.on === "0" && !confirm("Switch off this company? All its logins stop working until you switch it on again.")) return;
      await api(`/api/admin/companies/${b.dataset.co}`, { method: "PUT", json: { active: b.dataset.on === "1" } }); load();
    } else if (b.dataset.inv) {
      await api(`/api/admin/invites/${encodeURIComponent(b.dataset.inv)}`, { method: "PUT", json: { active: b.dataset.on === "1" } }); load();
    } else if (b.id === "nc-add") {
      const r = await api("/api/admin/companies", { json: { name: $("#nc-name").value, owner: $("#nc-owner").value, email: $("#nc-email").value.trim() } });
      await load();
      const msg = `Your SiteBakkie login is ready.\nOpen ${location.origin}/app.html\nEmail: ${r.email}\nTemporary password: ${r.temp_password}\nChange it under More → My profile.`;
      $("#view").insertAdjacentHTML("afterbegin", `<div class="note ok"><b>Company made.</b> Send this to the owner:<pre style="white-space:pre-wrap;margin:8px 0 0">${esc(msg)}</pre></div>`);
      scrollTo(0, 0);
    } else if (b.id === "inv-add") {
      const r = await api("/api/admin/invites", { json: { label: $("#inv-label").value } });
      await load(); $("#inv-out").innerHTML = `<div class="note ok">New code: <b>${esc(r.code)}</b>. Sign-up page: ${location.origin}/app.html#signup</div>`;
    } else if (b.dataset.add) {
      const id = b.dataset.add;
      const r = await api("/api/admin/users", { json: { company_id: id, name: document.querySelector(`[data-new-name="${id}"]`).value,
        email: document.querySelector(`[data-new-email="${id}"]`).value, role: document.querySelector(`[data-new-role="${id}"]`).value } });
      await load(); alert(`Login made for ${r.email}. Temporary password: ${r.temp_password}`);
    }
  } catch (err) { alert(err.message); }
});
document.addEventListener("change", async (e) => {
  const id = e.target.dataset.role; if (!id) return;
  try { await api(`/api/admin/users/${id}`, { method: "PUT", json: { role: e.target.value } }); } catch (err) { alert(err.message); load(); }
});
code ? load() : login();
</script>
</body>
</html>
